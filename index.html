<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moon訂單計算系統</title>
  <style>
    body { font-family: 'Microsoft JhengHei', sans-serif; max-width: 1000px; margin: auto; padding: 20px; }
    table { width: 100%; table-layout: fixed; border-collapse: collapse; margin-bottom: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; word-wrap: break-word; }
    th { text-align: center; }
    td.name-col { text-align: left; }
    td.price-col { text-align: right; }
    tr:nth-child(even) { background-color: #f2f2f2; }
    input[type=number] { width: 60px; }
    button { padding: 10px 20px; font-size: 16px; margin-top: 10px; }
    #orderSummary { margin-top: 20px; background: #f9f9f9; padding: 15px; border-radius: 6px; white-space: pre-line; }
    #copyBtn { display: none; margin-top: 10px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
    h2 { background: #eef; padding: 5px; }
    .in-stock { color: green; text-align: center; }
    .out-stock { color: gray; text-align: center; }
    .hot-stock { color: red; text-align: center; }
  </style>
</head>
<body>

  <h1>💊 Moon訂單計算系統 (每日持續更新中)</h1>
  <p style="color: red;">1.輸入需求數量 → 2.系統計算總金額 → 3.複製明細給業務</p>
  <p>混搭(含冷品)3000出貨、下收<br>【明細給客服後,送達需7~10天(不含假日),故不建議急單!】</p>
  <p style="color: red;">部分藥品被大量下單,若有庫存不足,到貨後會再次出貨,造成不便請見諒</p>

  <h2>熱門商品</h2>
  <table>
    <colgroup>
      <col style="width:20%">
      <col style="width:25%">
      <col style="width:15%">
      <col style="width:10%">
      <col style="width:20%">
      <col style="width:10%">
    </colgroup>
    <thead>
      <tr>
        <th>健保碼</th>
        <th>藥品名稱</th>
        <th>規格</th>
        <th>優惠價</th>
        <th>庫存</th>
        <th>數量</th>
      </tr>
    </thead>
    <tbody id="XproductTableBody"></tbody>
  </table>
  
  <h2>一般藥品</h2>
  <table>
    <colgroup>
      <col style="width:20%">
      <col style="width:25%">
      <col style="width:15%">
      <col style="width:10%">
      <col style="width:20%">
      <col style="width:10%">
    </colgroup>
    <thead>
      <tr>
        <th>健保碼</th>
        <th>藥品名稱</th>
        <th>規格</th>
        <th>優惠價</th>
        <th>庫存</th>
        <th>數量</th>
      </tr>
    </thead>
    <tbody id="productTableBody"></tbody>
  </table>

  <h2>壯陽 / 避孕 / 無健保藥物</h2>
  <table>
    <colgroup>
      <col style="width:20%">
      <col style="width:25%">
      <col style="width:15%">
      <col style="width:10%">
      <col style="width:20%">
      <col style="width:10%">
    </colgroup>
    <thead>
      <tr>
        <th>健保碼</th>
        <th>藥品名稱</th>
        <th>規格</th>
        <th>優惠價</th>
        <th>庫存</th>
        <th>數量</th>
      </tr>
    </thead>
    <tbody id="specialTableBody"></tbody>
  </table>

  <h2>冷品</h2>
  <table>
    <colgroup>
      <col style="width:20%">
      <col style="width:25%">
      <col style="width:15%">
      <col style="width:10%">
      <col style="width:20%">
      <col style="width:10%">
    </colgroup>
    <thead>
      <tr>
        <th>健保碼</th>
        <th>藥品名稱</th>
        <th>規格</th>
        <th>優惠價</th>
        <th>庫存</th>
        <th>數量</th>
      </tr>
    </thead>
    <tbody id="coldTableBody"></tbody>
  </table>

  <button onclick="placeOrder()">計算</button>
  <div id="orderSummary"></div>
  <button id="copyBtn" onclick="copyOrder()">複製訂單明細</button>

<script>
  let data = {
    Xproducts: [],
    products: [],
    specialProducts: [],
    coldProducts: []
  };

  fetch('data.json')
    .then(response => {
      if (!response.ok) {
        throw new Error(`data.json 讀取失敗：${response.status}`);
      }
      return response.json();
    })
    .then(json => {
      data = json;

      renderTable(data.Xproducts || [], "XproductTableBody", "ty");
      renderTable(data.products || [], "productTableBody", "qty");
      renderTable(data.specialProducts || [], "specialTableBody", "spqty");
      renderTable(data.coldProducts || [], "coldTableBody", "cdqty");
    })
    .catch(err => {
      console.error("讀取資料錯誤：", err);
      document.getElementById("orderSummary").textContent =
        "商品資料讀取失敗，請確認 data.json 是否存在以及 JSON 格式是否正確。";
    });


  function renderTable(list, tableId, prefix) {
    const tableBody = document.getElementById(tableId);

    if (!tableBody) {
      console.error(`找不到表格：${tableId}`);
      return;
    }

    tableBody.innerHTML = '';

    list.forEach((p, i) => {
      let stockClass = 'in-stock';

      if ((p.stock || '').includes('缺貨')) {
        stockClass = 'out-stock';
      } else if ((p.stock || '').includes('熱門')) {
        stockClass = 'hot-stock';
      }

      const row = document.createElement('tr');

      row.innerHTML = `
        <td>${p.nhicode || ''}</td>
        <td class="name-col">${p.medname || ''}</td>
        <td>${p.spec || ''}</td>
        <td class="price-col">${p.price || 0}</td>
        <td class="${stockClass}">${p.stock || ''}</td>
        <td>
          <input
            type="number"
            id="${prefix}${i}"
            min="0"
            value="0"
          >
        </td>
      `;

      tableBody.appendChild(row);
    });
  }


  function placeOrder() {
    let summary = "🧾 訂單明細\n";
    let total = 0;

    function addLine(p, qty) {
      const subtotal = qty * Number(p.price || 0);

      total += subtotal;

      summary +=
        `${p.medname} x${qty}\n` +
        `單價：${p.price}\n\n`;
    }


    // 熱門商品
    (data.Xproducts || []).forEach((p, i) => {
      const input = document.getElementById(`ty${i}`);
      const qty = parseInt(input?.value || 0, 10) || 0;

      if (qty > 0) {
        addLine(p, qty);
      }
    });


    // 一般藥品
    (data.products || []).forEach((p, i) => {
      const input = document.getElementById(`qty${i}`);
      const qty = parseInt(input?.value || 0, 10) || 0;

      if (qty > 0) {
        addLine(p, qty);
      }
    });


    // 壯陽 / 避孕 / 無健保藥物
    (data.specialProducts || []).forEach((p, i) => {
      const input = document.getElementById(`spqty${i}`);
      const qty = parseInt(input?.value || 0, 10) || 0;

      if (qty > 0) {
        addLine(p, qty);
      }
    });


    // 冷品
    (data.coldProducts || []).forEach((p, i) => {
      const input = document.getElementById(`cdqty${i}`);
      const qty = parseInt(input?.value || 0, 10) || 0;

      if (qty > 0) {
        addLine(p, qty);
      }
    });


    summary +=
      "----------------------\n" +
      "總金額：" + total.toLocaleString();


    const orderSummary = document.getElementById("orderSummary");
    const copyBtn = document.getElementById("copyBtn");

    if (total > 0) {
      orderSummary.textContent = summary;
      copyBtn.style.display = 'inline-block';
    } else {
      orderSummary.textContent = "請選擇商品數量！";
      copyBtn.style.display = 'none';
    }
  }


  function copyOrder() {
    const summaryText =
      document.getElementById("orderSummary").textContent;

    navigator.clipboard.writeText(summaryText)
      .then(() => {
        alert('訂單明細已複製到剪貼簿');
      })
      .catch(err => {
        console.error("複製失敗：", err);
        alert("複製失敗，請手動複製訂單明細");
      });
  }
</script>

</body>
</html>
